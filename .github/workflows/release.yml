name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. v0.2.3)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            arch_label: x86_64-linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch_label: aarch64-linux
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assert fully static binary
        run: |
          BIN="target/${{ matrix.target }}/release/wlroots-bridge"
          file "$BIN"
          if ! file "$BIN" | grep -qE "statically linked|static-pie linked"; then
            echo "FAIL: $BIN is not statically linked" >&2
            exit 1
          fi
          LDD_OUT="$(ldd "$BIN" 2>&1 || true)"
          echo "$LDD_OUT"
          if ! echo "$LDD_OUT" | grep -qi "not a dynamic executable\|statically linked"; then
            echo "FAIL: ldd reports $BIN is dynamically linked" >&2
            exit 1
          fi
          echo "OK: $BIN is fully static"

      - name: Stage archive
        env:
          ARCH_LABEL: ${{ matrix.arch_label }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE="wlroots-bridge-${RELEASE_TAG}-${ARCH_LABEL}.tar.gz"
          mkdir -p staged
          cp "target/${TARGET}/release/wlroots-bridge" staged/wlroots-bridge
          tar -C staged -czf "$ARCHIVE" wlroots-bridge
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wlroots-bridge-${{ matrix.arch_label }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksum manifest
        run: |
          cd dist
          cat *.tar.gz.sha256 > SHA256SUMS
          rm -f *.tar.gz.sha256
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
