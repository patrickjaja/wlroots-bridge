[package]
name = "wlroots-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Patrick Jaja"]
description = "wlroots-Wayland support bridge for Linux computer-use tooling (Claude Desktop)."

[dependencies]
cu-atspi = { git = "https://github.com/patrickjaja/cu-atspi", rev = "30ff9c84332569aadb4b83364cfdc89fa7ca6a04", features = ["clap"] }
# Shared runner for the `abort-watch` subcommand, pinned by rev like cu-atspi.
cu-abort-watch = { git = "https://github.com/patrickjaja/cu-abort-watch", rev = "c8be7212b6e40e582aebc6023d69d20bbedf79dc" }
# Shared layer-shell renderer for the `overlay` subcommand (glow and drawn cursor).
cu-overlay = { git = "https://github.com/patrickjaja/cu-overlay", rev = "e1f1a9127888fefc2a930d6fc64330e474d8af89" }
libc = { version = "0.2.186", default-features = false, features = ["std"] }
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "std", "help", "suggestions"], default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
xkeysym = "0.2.1"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# Client code for the vendored Hyprland protocol XML in protocols/ (build time
# only; `bitflags` is what the generated code uses for bitfield enums).
wayland-scanner = "0.31.10"
bitflags = "2.13.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
opt-level = 3
